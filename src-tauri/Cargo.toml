[package]
name = "servercontrol-gui"
version = "0.1.0"
description = "GUI (Tauri) für Server Control for Farming Simulator 2025"
edition = "2021"
rust-version = "1.77.2"

# Eigener Workspace-Root: hält die GUI aus dem Kern-Workspace heraus. So baut die CI weiter nur
# core+cli (plattformarm); die GUI braucht die Tauri-/WebView-Toolchain und wird über `cargo tauri`
# gebaut. Der Pfad-Dependency auf ../crates/core funktioniert trotzdem.
[workspace]

[lib]
name = "servercontrol_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Nativer Dateiauswahl-Dialog fuer den Mod-Upload (G3) - liefert einen echten Dateisystempfad,
# den `upload_mod` dann selbst einliest (kein Binaerdaten-Umweg ueber die IPC-Bruecke).
tauri-plugin-dialog = "2"

# Die Kernbibliothek — der einzige Ort mit Logik. Die Commands sind dünne Wrapper.
servercontrol-core = { path = "../crates/core" }
tokio = { version = "1", features = ["sync"] }
url = "2"
