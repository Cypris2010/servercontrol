[package]
name = "servercontrol-core"
version = "0.1.0"
edition = "2021"
description = "Kernbibliothek für Server Control for Farming Simulator 2025"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
url = { version = "2", features = ["serde"] }

# HTTP-Sitzung mit Cookie-Speicher; rustls statt OpenSSL (plattformarm, Q5).
reqwest = { version = "0.12", default-features = false, features = ["cookies", "rustls-tls"] }
# HTML auswerten (Login-Formular erkennen, status-indicator, Mod-Listen).
scraper = "0.20"
# OS-Credential-Store (Q1): Passwörter nur hier, nie im Repo/Log. Reines Rust-Krypto.
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }

[dev-dependencies]
# Nur für das Livetest-Beispiel (examples/login.rs): async-Laufzeit.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
