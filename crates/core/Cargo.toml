[package]
name = "servercontrol-core"
version = "0.1.0"
edition = "2021"
description = "Kernbibliothek für Server Control for Farming Simulator 2025"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
url = { version = "2", features = ["serde"] }
# Rohe Fehlerdetails (reqwest-Fehlerursache, HTML-Ausschnitte bei Parse-Fehlern) landen nur im
# Log, nie in der kurzen Nutzer-Meldung aus error.rs — die GUI hängt das App-seitig ein Sink ein.
log = "0.4"

# HTTP-Sitzung mit Cookie-Speicher; rustls statt OpenSSL (plattformarm, Q5).
# multipart für den Mod-Upload (modUpload-Formular).
reqwest = { version = "0.12", default-features = false, features = [
    "cookies",
    "rustls-tls",
    "multipart",
    "stream",
] }
# HTML auswerten (Login-Formular erkennen, status-indicator, Mod-Listen).
scraper = "0.20"
# OS-Credential-Store (Q1): Passwörter nur hier, nie im Repo/Log. Reines Rust-Krypto.
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
# Warten auf Zustandswechsel (Polling) + Datei lesen/schreiben fürs Hoch-/Herunterladen.
# reqwest bringt tokio mit; "io-util" für `AsyncWriteExt` beim Savegame-Download (Kap. 7.8 LH).
tokio = { version = "1", features = ["time", "fs", "io-util"] }
# Log-Inhalt kommt base64-kodiert vom Live-Log-Endpunkt (MZ5).
base64 = "0.22"
# Plattformkonformer Konfigurationsordner (Kap. 8.3) — nicht geraten, sondern ermittelt.
directories = "5"
# Stabile Profil-ID als Credential-Store-Schlüssel (Kap. 8.4), unabhängig von Adresse/Nutzer.
uuid = { version = "1", features = ["v4", "serde"] }
# Upload als Datei-Strom statt komplett im Speicher — dabei den Fortschritt mitzählen (Kap. 7.3
# `progress`-Events, G3).
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false }
# Eigene Version aus modDesc.xml im Zip lesen, vor dem Hochladen — Abgleich mit der Server-
# Version (G3, Ueberschreiben-Entscheidung).
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
# Nur für das Livetest-Beispiel (examples/login.rs): async-Laufzeit.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
