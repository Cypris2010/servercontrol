name: Release

# Baut die App fuer macOS/Linux/Windows und haengt die Installer an ein GitHub Release --
# ausgeloest durch einen gepushten Tag (z. B. `v0.1.0`):
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Kein tauri-apps/tauri-action: das Frontend hat kein package.json (statisches HTML/JS ohne
# Build-Schritt), die npm-Erkennung der Action wuerde nur unnoetige Komplexitaet bringen.
# Stattdessen direkt `cargo tauri build` + Upload der Bundle-Dateien ans Release.

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    # Default-GITHUB_TOKEN ist sonst nur read-only -- ohne das hier schlaegt das Release-Erstellen
    # mit 403 "Resource not accessible by integration" fehl (live beobachtet).
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Tauri v2 braucht unter Linux WebKitGTK/AppIndicator/rsvg zum Bauen, `keyring`
      # (Credential-Store-Zugriff) zusaetzlich libdbus (siehe ci.yml).
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            pkg-config

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build app
        run: cargo tauri build

      - name: Upload bundles to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
